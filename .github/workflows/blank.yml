# .github/workflows/deploy-odoo.yml
name: Odoo CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prostredicko
    permissions:
      contents: read
      packages: write
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
      IMAGE_REPO: ghcr.io/${{ github.repository }}/odoo
      IMAGE_TAG: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.30.0'

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Write kubeconfig
      shell: bash
      run: |
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$KUBECONFIG"
        chmod 600 "$KUBECONFIG"

    # ===== Build & push image s addony =====
    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build and push Odoo image (with addons)
      run: |
        docker build -t "$IMAGE_REPO:$IMAGE_TAG" .
        docker push "$IMAGE_REPO:$IMAGE_TAG"

    # ===== Helm upgrade na nový image =====
    - name: Upgrade Odoo release
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm upgrade --install mikulas-odoo bitnami/odoo \
          --version 28.2.10 \
          --namespace default \
          --reuse-values \
          --wait --timeout 15m --atomic \
          --kubeconfig "$KUBECONFIG" \
          --set global.security.allowInsecureImages=true \
          --set image.registry=ghcr.io \
          --set image.repository=${{ github.repository }}/odoo \
          --set image.tag=${{ github.sha }}

    - name: Wait for deployment
      shell: bash
      run: |
        set -euo pipefail
        DEPLOY=$(kubectl get deploy -n default \
          -l app.kubernetes.io/instance=mikulas-odoo,app.kubernetes.io/name=odoo \
          -o jsonpath='{.items[0].metadata.name}' \
          --kubeconfig "$KUBECONFIG")
        echo "Deployment: $DEPLOY"
        kubectl rollout status deployment/"$DEPLOY" -n default --timeout=15m --kubeconfig "$KUBECONFIG"

    - name: Wait for Odoo pod to be Ready
      shell: bash
      run: |
        set -euo pipefail
        sel='app.kubernetes.io/instance=mikulas-odoo,app.kubernetes.io/name=odoo'
        # počkej až 10 minut na condition=Ready
        kubectl wait --for=condition=Ready pod -l "$sel" -n default --timeout=10m --kubeconfig "$KUBECONFIG"


    - name: Helm status
      if: always()
      run: |
        helm status mikulas-odoo -n default --kubeconfig "$KUBECONFIG" || true
        kubectl get deploy,po,svc,pvc -n default --kubeconfig "$KUBECONFIG" -o wide || true

    # ===== Automatické nainstalování/aktualizace addonů =====
    - name: Compute addon list
      id: mods
      shell: bash
      run: |
        set -euo pipefail
        mods=()
        if [ -d addons ]; then
          shopt -s nullglob
          for d in addons/*; do
            [ -d "$d" ] && [ -f "$d/__manifest__.py" ] && mods+=("$(basename "$d")")
          done
        fi
        if [ ${#mods[@]} -gt 0 ]; then
          MODS=$(IFS=, ; echo "${mods[*]}")
          echo "Found addons: ${MODS}"
        else
          MODS=""
          echo "No addons with __manifest__.py found in ./addons"
        fi
        echo "mods=${MODS}" >> "$GITHUB_OUTPUT"


    - name: Snapshot pods before module upgrade
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "== Deployments =="; kubectl get deploy -n default --kubeconfig "$KUBECONFIG" -o wide || true
        echo "== Pods ==";        kubectl get pods   -n default --kubeconfig "$KUBECONFIG" -o wide || true
        echo "== Events ==";      kubectl get events -n default --kubeconfig "$KUBECONFIG" --sort-by=.lastTimestamp | tail -n 200 || true

        # Pokud existují nějaké Odoo pody, vypiš detail a logy
        for p in $(kubectl get pods -n default -l app.kubernetes.io/instance=mikulas-odoo,app.kubernetes.io/name=odoo --kubeconfig "$KUBECONFIG" -o name); do
          echo "==== DESCRIBE $p ===="; kubectl describe "$p" -n default --kubeconfig "$KUBECONFIG" || true
          echo "==== LOGS $p ====";     kubectl logs "$p" -n default --kubeconfig "$KUBECONFIG" --all-containers --tail=200 || true
        done


    - name: Upgrade Odoo modules
      shell: bash
      run: |
        set -euo pipefail
        sel='app.kubernetes.io/instance=mikulas-odoo,app.kubernetes.io/name=odoo'
        POD=$(kubectl get pods -n default -l "$sel" --kubeconfig "$KUBECONFIG" \
              -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Ready"&&@.status=="True")])].metadata.name}' \
              | awk '{print $1}')
        if [ -z "${POD:-}" ]; then
          echo "Pod ještě není Ready, zkouším vybrat jakýkoli běžící pod…"
          POD=$(kubectl get pods -n default -l "$sel" --kubeconfig "$KUBECONFIG" \
                -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' \
                | awk '{print $1}')
        fi
        [ -n "${POD:-}" ] || { echo "Nenalezl jsem Odoo pod"; exit 1; }

        sleep 5

        kubectl exec -n default "$POD" --kubeconfig "$KUBECONFIG" -- bash -lc \
          "/opt/bitnami/odoo/bin/odoo -c /opt/bitnami/odoo/conf/odoo.conf --workers 0 \
          -d bitnami_odoo -u all --stop-after-init"
