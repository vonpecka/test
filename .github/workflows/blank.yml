# .github/workflows/deploy-odoo.yml
name: Odoo CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production        # <-- jméno env z GitHubu
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup kubectl a helm
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.30.0'
    - name: Set up Helm
      uses: azure/setup-helm@v3

        # Uložení kubeconfigu (tajný údaj) na disk
    - name: Write kubeconfig
      shell: bash
      run: |
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ${{ github.workspace }}/kubeconfig
        chmod 600 ${{ github.workspace }}/kubeconfig

    # Helm upgrade – použijeme reuse-values, aby se nezměnily ostatní parametry. Image tag dáte na SHA commit nebo „latest“.
    - name: Upgrade Odoo release
      env:
        KUBECONFIG: ${{ github.workspace }}/kubeconfig
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm upgrade --install mikulas-odoo bitnami/odoo \
          --version 28.2.10 \
          --namespace default \
          --reuse-values \
          --wait

    # Po rollout zkontrolujeme, že release je ready
    - name: Wait for deployment
      env:
        KUBECONFIG: ${{ github.workspace }}/kubeconfig
      run: |
        kubectl rollout status deployment/mikulas-odoo -n default

    # Spuštění upgrade modulů uvnitř běžícího podu
    - name: Upgrade Odoo modules
      env:
        KUBECONFIG: ${{ github.workspace }}/kubeconfig
      run: |
        POD=$(kubectl get pods -l app.kubernetes.io/component=odoo -l app.kubernetes.io/instance=mikulas-odoo -n default -o jsonpath='{.items[0].metadata.name}')
        # spustíme upgrade všech modulů (-u all) a server po dokončení skončí (--stop-after-init)
        kubectl exec -n default $POD -- \
          /opt/bitnami/odoo/bin/odoo -c /opt/bitnami/odoo/conf/odoo.conf --workers 0 \
          -d <název-databáze> -u all --stop-after-init
